<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title data-i18n="layer.title">Tochny Brosok — game map</title>
  <link rel="stylesheet" href="layer.css">
  <script src="i18n.js" defer></script><script src="landmarks-data.js" defer></script><script src="zone-patches.js" defer></script><script src="zone-detect.js" defer></script><script src="terrain-match.js" defer></script><script src="layer.js" defer></script>
</head>
<body class="layer">
<svg id="scene" aria-hidden="true"><circle id="rim" hidden/><g id="marks"></g></svg>
<div id="badge" class="badge" hidden><b id="badge-title"></b><span id="badge-note"></span></div>
<div id="pass-hint" class="pass-hint" role="status" hidden data-i18n="layer.passHint">The game has the mouse: the wheel zooms the map, a drag moves it</div>
<div id="busy" class="busy" role="status" hidden><i aria-hidden="true"></i><span id="busy-text" data-i18n="layer.busyWait">Looking for the game map…</span></div>
</body></html>
